[package]
name = "distance-bytes-cli"
description = "Command-line tools for Distance .bytes files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dbytes"
path = "src/main.rs"

[dependencies]
distance-bytes = { path = "../distance-bytes", features = ["schema"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
