[package]
name = "distance-bytes"
description = "Read and write the .bytes files of the game Distance"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# JSON Schema of the JSON format (`json::schema`).
schema = ["dep:schemars"]

[dependencies]
ryu = "1"
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps a schema's properties in order, so that `type` comes before `data`.
serde_json = { version = "1", features = [
    "float_roundtrip",
    "preserve_order",
    "raw_value",
    "unbounded_depth",
] }
serde_path_to_error = "0.1"
serde_with = { version = "3", default-features = false, features = ["macros"] }

# Grows the stack for deeply nested objects; wasm has no stack switching.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker = "0.1"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
