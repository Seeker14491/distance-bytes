[package]
name = "distance-bytes-wasm"
description = "JavaScript bindings of distance-bytes for browsers and Node, via wasm-bindgen"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["schema"]
# `schema()`, the JSON Schema of the JSON format.
schema = ["distance-bytes/schema", "dep:serde_json"]

[dependencies]
distance-bytes = { path = "../distance-bytes" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde-wasm-bindgen = "0.6"
# The `wasm-bindgen` command that generates the JavaScript must be this version.
wasm-bindgen = "=0.2.129"
