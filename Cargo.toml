[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.test]
opt-level = 2

# The wasm package, built with `--profile wasm`: less than half the size of a release build,
# for about a fifth more time.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
